services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: solarforge
      POSTGRES_PASSWORD: solarforge
      POSTGRES_DB: solarforge
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U solarforge"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - solarforge-pg:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  solarforge-pg:
